name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: make check

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build archive
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: make release-platform
      - uses: actions/upload-artifact@v4
        with:
          name: rclonewatch-linux-${{ matrix.goarch }}
          path: |
            target/rclonewatch_linux_${{ matrix.goarch }}.tar.gz
            target/rclonewatch_linux_${{ matrix.goarch }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rclonewatch-linux-*
          path: target
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" target/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" target/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
